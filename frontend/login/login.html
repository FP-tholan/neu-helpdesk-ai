<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng Nhập</title>
<link rel="stylesheet" href="login_style.css">
</head>
<body>
  <div class="login-box">
    <img src="Bieu-tuong-1-1-scaled.webp" alt="Logo" class="logo">
    <h1 class="site-title">NEU HelpDesk</h1>
    <h2>Đăng nhập</h2>
    <form id="loginForm" novalidate>
      <div class="input-group">
        <label>Email</label>
        <input type="text" id="email" placeholder="Nhập email">
        <span class="error-slot" id="email-error"></span>
      </div>
      <div class="input-group">
        <label>Mật Khẩu</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Nhập mật khẩu">
          <span class="toggle-eye" id="togglePassword">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </span>
        </div>
        <span class="error-slot" id="password-error"></span>
      </div>
      <div class="options">
        <label><input type="checkbox" id="rememberMe"> Ghi nhớ đăng nhập</label>
        <a href="#">Quên mật khẩu</a>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">Đăng Nhập</button>
    </form>
  </div>
<script src="login.js"></script>
</body>
</html>
